version: '3.8'

services:
  app:
    build: .
    ports:
      - "3500:3500"
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # P3-5: Bind to localhost only — app connects via Docker network, no public exposure
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Early SKU Detection — Python async service
  early-sku-detector:
    build:
      context: ./early-sku-detector
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://detector:detector_local@postgres:5432/early_sku
      - DATABASE_URL_SYNC=postgresql://detector:detector_local@postgres:5432/early_sku
    env_file:
      - ./early-sku-detector/.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: detector
      POSTGRES_PASSWORD: detector_local
      POSTGRES_DB: early_sku
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detector -d early_sku"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  pg_data:
