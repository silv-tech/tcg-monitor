<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCG Monitor — Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
    .header { background: #1a1a1a; border-bottom: 1px solid #333; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
    .header h1 { font-size: 20px; color: #fff; }
    .header .status { font-size: 13px; padding: 4px 12px; border-radius: 12px; }
    .status.ok { background: #0d3b1a; color: #4ade80; }
    .status.bad { background: #3b0d0d; color: #f87171; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .section { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section h2 { font-size: 16px; color: #fff; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .card { background: #222; border: 1px solid #333; border-radius: 8px; padding: 14px; }
    .card .name { font-weight: 600; color: #fff; margin-bottom: 6px; }
    .card .meta { font-size: 13px; color: #888; }
    .card .health { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .card .health.green { background: #4ade80; }
    .card .health.red { background: #f87171; }
    .card .health.yellow { background: #facc15; }
    .toggle { cursor: pointer; padding: 4px 10px; border-radius: 4px; border: 1px solid #444; background: #333; color: #ccc; font-size: 12px; }
    .toggle:hover { background: #444; }
    .stats { display: flex; gap: 20px; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat .num { font-size: 28px; font-weight: 700; color: #fff; }
    .stat .label { font-size: 12px; color: #888; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 8px; color: #888; border-bottom: 1px solid #333; }
    td { padding: 8px; border-bottom: 1px solid #222; }
    input, select { background: #222; border: 1px solid #444; color: #e0e0e0; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
    button { cursor: pointer; padding: 6px 14px; border-radius: 6px; border: none; font-size: 13px; font-weight: 500; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { background: #dc2626; }
    .form-row { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .api-key-bar { display: flex; gap: 8px; align-items: center; }
    .api-key-bar input { width: 240px; }
    #log { background: #111; border: 1px solid #333; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; color: #888; }
  </style>
</head>
<body>
  <div class="header">
    <h1>TCG Monitor</h1>
    <div class="api-key-bar">
      <input type="password" id="apiKey" placeholder="API Key" />
      <button class="btn-primary" onclick="loadAll()">Connect</button>
      <span id="sysStatus" class="status">—</span>
    </div>
  </div>

  <div class="container">
    <div class="section">
      <h2>System Stats</h2>
      <div class="stats" id="statsContainer">
        <div class="stat"><div class="num" id="statRetailers">—</div><div class="label">Retailers</div></div>
        <div class="stat"><div class="num" id="statProducts">—</div><div class="label">Tracked</div></div>
        <div class="stat"><div class="num" id="statRequests">—</div><div class="label">Requests</div></div>
        <div class="stat"><div class="num" id="statBlocked">—</div><div class="label">Blocked</div></div>
      </div>
    </div>

    <div class="section">
      <h2>Retailers</h2>
      <div class="grid" id="retailersGrid"></div>
    </div>

    <div class="section">
      <h2>Tracked Keywords</h2>
      <div id="keywordsList"></div>
      <div class="form-row">
        <input type="text" id="newKeyword" placeholder="New keyword..." />
        <button class="btn-primary" onclick="addKeyword()">Add</button>
      </div>
    </div>

    <div class="section">
      <h2>Tracked SKUs</h2>
      <table>
        <thead><tr><th>SKU</th><th>Retailer</th><th>Name</th><th>Added</th><th></th></tr></thead>
        <tbody id="skuTable"></tbody>
      </table>
      <div class="form-row">
        <input type="text" id="newSku" placeholder="SKU" />
        <input type="text" id="newSkuRetailer" placeholder="Retailer ID" />
        <input type="text" id="newSkuName" placeholder="Name" />
        <button class="btn-primary" onclick="addSku()">Add</button>
      </div>
    </div>

    <div class="section">
      <h2>Log</h2>
      <div id="log">Waiting for connection...</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
